<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Aegis | CS2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>TEAM AEGIS</h1>
        <nav>
            <a href="#roster">Состав</a>
            <a href="#results">Результаты</a>
        </nav>
    </header>

    <section id="roster" class="section">
        <h2>Active Roster</h2>
        <div class="grid">
            <div class="card"><h3>Player 1</h3><p>IGL</p></div>
            <div class="card"><h3>Player 2</h3><p>AWPer</p></div>
            <div class="card"><h3>Player 3</h3><p>Rifler</p></div>
            <div class="card"><h3>Player 4</h3><p>Entry</p></div>
            <div class="card"><h3>Player 5</h3><p>Support</p></div>
        </div>
    </section>

    <section id="results" class="section">
        <h2>Recent Results</h2>
        <ul>
            <li>Tournament 1 — 1st Place</li>
            <li>Tournament 2 — Semi-Finals</li>
        </ul>
    </section>

    <footer>
        <p>&copy; 2025 Team Aegis</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
